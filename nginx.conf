server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1k;
    location = /health { return 200 'ok'; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
